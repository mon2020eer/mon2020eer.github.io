<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 72" width="128" height="72" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">المسار المتحد للخدمات السياحية</title>
  <desc id="logoDesc">حرف «س» مدمج مع حرف M — موجتان تمثلان مسارات الطيران تصعد منهما طائرة. كل الخطوط منحنية، لا خط عمودي يعبر خطاً أفقياً.</desc>

  <defs>
    <linearGradient id="amtWaveFront" x1="8" y1="48" x2="120" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1C786B"/>
      <stop offset=".55" stop-color="#1C786B"/>
      <stop offset="1" stop-color="#C0BAA4"/>
    </linearGradient>
    <linearGradient id="amtWaveBack" x1="8" y1="40" x2="120" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C0BAA4"/>
      <stop offset=".5" stop-color="#1C786B"/>
      <stop offset="1" stop-color="#C0BAA4"/>
    </linearGradient>
  </defs>

  <!-- الموجة الخلفية -->
  <path d="M6 46C22 18 44 18 60 46s38 28 54 0"
        fill="none" stroke="url(#amtWaveBack)" stroke-width="5.5" stroke-linecap="round" opacity=".75"/>

  <!-- الموجة الأمامية -->
  <path d="M6 52C24 30 42 30 60 52s36 22 56 -6"
        fill="none" stroke="url(#amtWaveFront)" stroke-width="6.5" stroke-linecap="round"/>

  <!-- الطائرة الصاعدة -->
  <path d="M52 22c3.4-3.6 7.2-6.6 9-5.6 1.7 1 .3 5-2.2 8.9l7.7 2.6-2.6 3.4-8.6-.7-3.4 4 1.6 4.2-2.3 2.1-3.4-5.4-5.6-3 2.3-2.2 4.3 1.3z"
        fill="#C0BAA4"/>
</svg>
