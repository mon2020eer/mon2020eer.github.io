<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">المسار المتحد للخدمات السياحية</title>
  <desc>خيطان منسابان يلتقيان في مسار واحد صاعد ينتهي بنقطة وصول، داخل قوس مفتوح. لا خط عمودي يعبر خطاً أفقياً.</desc>
  <defs>
    <linearGradient id="mgrad" x1="62" y1="62" x2="41" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#082A30"/>
      <stop offset="1" stop-color="#0E7A69"/>
    </linearGradient>
  </defs>

  <!-- القوس المفتوح: خط الأفق. الفتحة في الأعلى يخرج منها المسار -->
  <path d="M13.1 53.2 A52 52 0 1 0 47.9 14.5"
        fill="none" stroke="#082A30" stroke-opacity=".26" stroke-width="3.5" stroke-linecap="round"/>

  <!-- الخيط الأول -->
  <path d="M100 96C92 96 75.4 88.8 62 62"
        fill="none" stroke="#082A30" stroke-width="6.5" stroke-linecap="round"/>
  <!-- الخيط الثاني -->
  <path d="M104 68C92 70 70 78.1 62 62"
        fill="none" stroke="#082A30" stroke-width="6.5" stroke-linecap="round"/>

  <!-- المسار الواحد بعد الالتئام، أثقل لأنه يحمل الاثنين -->
  <path d="M62 62C56 50 50 38 45 27"
        fill="none" stroke="url(#mgrad)" stroke-width="10" stroke-linecap="round"/>

  <!-- الوصول -->
  <circle cx="39" cy="16" r="6.5" fill="#0E7A69"/>
</svg>
